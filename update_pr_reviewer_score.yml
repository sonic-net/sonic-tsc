trigger: none
pr: none

parameters:
- name: repos
  displayName: 'Repositories (all, or space-separated owner/repo names)'
  type: string
  default: all

schedules:
- cron: '0 0 * * 0'
  always: true
  branches:
    include:
    - master

pool: sonic-ubuntu-1c

jobs:
- job: update
  timeoutInMinutes: 600
  variables:
  - group: SONICBLD
  steps:
  - checkout: self
    clean: true
    path: s
  - bash: |
      set -x

      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      sudo apt update
      sudo apt install gh jq python3-venv -y

      echo $TOKEN | gh auth login --with-token
      git remote remove sonicbld || true
      git remote add sonicbld https://mssonicbld:$TOKEN@github.com/mssonicbld/sonic-tsc/
      git fetch sonicbld
      git config user.email 'sonicbld@microsoft.com'
      git config user.name 'Sonic Automation'
    env:
      TOKEN: $(GITHUB-TOKEN)
    displayName: setup env

  - bash: |
      set -ex

      generator_args=()
      if [ "$REVIEWER_REPOS" != "all" ]; then
        if [[ "$REVIEWER_REPOS" == *$'\n'* || "$REVIEWER_REPOS" == *$'\r'* ]]; then
          echo "Repositories must be a single space-separated line." >&2
          exit 1
        fi
        read -r -a selected_repos <<< "$REVIEWER_REPOS"
        if [ ${#selected_repos[@]} -eq 0 ]; then
          echo "Specify 'all' or at least one owner/repo name." >&2
          exit 1
        fi
        for repo in "${selected_repos[@]}"; do
          if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "Invalid repository name: $repo (expected owner/repo)." >&2
            exit 1
          fi
        done
        generator_args=(-r "${selected_repos[*]}")
      fi

      git reset origin/master --hard
      cd pr_reviewer
      ./generate_pr_reviewer.sh "${generator_args[@]}"
      git add .
      git commit -m "[data] Update PR reviewer score data." || exit 0
      git push sonicbld HEAD:refs/heads/data/pr-reviewer -f
      re=$(gh pr create -R sonic-net/sonic-tsc -H mssonicbld:data/pr-reviewer -B master -b '' -t "[data] Update PR reviewer score data." 2>&1 || true)
      sleep 60
      gh pr edit $(echo $re | grep -Eo 'https://github.com/sonic-net/sonic-tsc/pull/[0-9]*') --add-label automerge
      git reset origin/master --hard
      cd ..
    displayName: update PR reviewer scores
    env:
      GITHUB_API_TOKENS: $(GITHUB-TOKEN)
      REVIEWER_REPOS: ${{ parameters.repos }}
